<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starlite Reward</title>
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;background:#0b2a5b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #ld{text-align:center;padding:24px}
  .sp{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#f08a4b;margin:0 auto 14px;animation:r 0.9s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  button{font:inherit;padding:10px 18px;border-radius:99px;border:0;background:#f08a4b;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div id="ld"><div class="sp"></div><div id="msg">Memuat Starlite Reward…</div></div>
<script>
/* Halaman pemuat: SEKALI dipasang di GitHub, tidak perlu diedit lagi.
   Isi aplikasi diambil dari Apps Script (file "Index") sehingga setiap Deploy di Apps Script otomatis terbaru di sini. */
(function(){
  var EXEC='https://script.google.com/macros/s/AKfycbwzFfC919JOKjANI8Gq6Ix6knLqaMpahIZw5zwcUU_vwoKN94pZRwYvfsyL22yIPHp48g/exec';
  var KEY='starlite-app-cache-v1';
  function read(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
  function save(j){ try{ localStorage.setItem(KEY,JSON.stringify(j)); }catch(e){} }
  function get(q,ms){
    var ctl=window.AbortController?new AbortController():null, t=ctl&&setTimeout(function(){ ctl.abort(); },ms||45000);
    return fetch(EXEC+'?app='+q+'&t='+Date.now(),{redirect:'follow',cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(function(r){ clearTimeout(t); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
  }
  function run(html){ document.open(); document.write(html); document.close(); }
  function fail(){
    var m=document.getElementById('msg'); if(!m) return;
    m.textContent='Gagal memuat aplikasi. Periksa koneksi lalu coba lagi.';
    var b=document.createElement('button'); b.textContent='Coba lagi'; b.onclick=function(){ location.reload(); };
    document.getElementById('ld').appendChild(b);
    var s=document.querySelector('.sp'); if(s) s.style.display='none';
  }
  var cache=read();
  if(cache&&cache.html){
    run(cache.html);                                   // tampil langsung dari salinan tersimpan
    get('v',20000).then(function(j){                    // lalu cek versi baru di latar belakang
      if(j&&j.v&&j.v!==cache.v){ return get('1').then(function(f){ if(f&&f.html){ save(f); location.reload(); } }); }
    }).catch(function(){});
  } else {
    get('1').then(function(j){ if(!j||!j.html) throw new Error('kosong'); save(j); run(j.html); }).catch(function(){
      // satu kali percobaan ulang (Apps Script kadang lambat saat pertama dipanggil)
      get('1').then(function(j){ if(!j||!j.html) throw new Error('kosong'); save(j); run(j.html); }).catch(fail);
    });
  }
})();
</script>
</body>
</html>
